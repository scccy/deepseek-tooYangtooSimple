name: build-desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos-dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: aarch64
            target: ''
          - runner: macos-14
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compile target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Package macOS .app + .dmg
        shell: zsh {0}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="${{ matrix.target }}" TARGET_ARCH="${{ matrix.arch }}" VERSION="$VERSION" zsh dsh-desktop/scripts/package-macos.sh
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Desktop-macOS-${{ matrix.arch }}
          path: |
            dsh-desktop/src-tauri/target/release/bundle/dmg/*.dmg
            dsh-desktop/src-tauri/target/release/bundle/macos/DeepSeek Harness Desktop.app

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Tauri CLI and build Windows bundles
        shell: pwsh
        run: |
          cd dsh-desktop
          npm install
          npx tauri build --bundles nsis

      - name: Rename installer (unified name)
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v','V')
          Set-Location dsh-desktop/src-tauri/target/release/bundle/nsis
          Get-ChildItem *.exe | Rename-Item -NewName "dsh-desktop-v${v}-windows-x86_64.exe"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Desktop-Windows
          path: dsh-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install WebKitGTK and Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build
        working-directory: dsh-desktop/src-tauri
        run: cargo build --release

      - name: Name binary (unified name)
        working-directory: dsh-desktop/src-tauri
        run: |
          V="${GITHUB_REF_NAME#v}"
          cp target/release/dsh-desktop "dsh-desktop-v${V}-linux-${{ matrix.arch }}"

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Desktop-Linux-${{ matrix.arch }}
          path: dsh-desktop/src-tauri/dsh-desktop-v*-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-dmg, windows-exe, linux-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Delete existing release (idempotent)
        run: gh release delete "$GITHUB_REF_NAME" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/dsh-desktop-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}