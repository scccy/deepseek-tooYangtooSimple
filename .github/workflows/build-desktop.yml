name: build-desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'dsh-desktop/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: write

jobs:
  macos-dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: aarch64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Package macOS .app + .dmg
        shell: zsh {0}
        run: zsh dsh-desktop/scripts/package-macos.sh
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Desktop-macOS-${{ matrix.arch }}
          path: |
            dsh-desktop/src-tauri/target/release/bundle/dmg/*.dmg
            dsh-desktop/src-tauri/target/release/bundle/macos/DeepSeek Harness Desktop.app

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Tauri CLI and build Windows bundles
        shell: pwsh
        run: |
          cd dsh-desktop
          npm install
          npx tauri build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Desktop-Windows
          path: dsh-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install WebKitGTK and Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build
        working-directory: dsh-desktop/src-tauri
        run: cargo build --release

      - name: Name binary with arch
        working-directory: dsh-desktop/src-tauri
        run: cp target/release/dsh-desktop "dsh-desktop-${{ matrix.arch }}"

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Desktop-Linux-${{ matrix.arch }}
          path: dsh-desktop/src-tauri/dsh-desktop-${{ matrix.arch }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-dmg, windows-exe, linux-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/dsh-desktop-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}