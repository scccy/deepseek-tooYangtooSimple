name: build-desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'dsh-desktop/**'
      - '.github/workflows/build-desktop.yml'

jobs:
  macos-dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Package macOS .app + .dmg
        shell: zsh {0}
        run: zsh dsh-desktop/scripts/package-macos.sh
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Desktop-macOS
          path: |
            dsh-desktop/src-tauri/target/release/bundle/dmg/*.dmg
            dsh-desktop/src-tauri/target/release/bundle/macos/DeepSeek Harness Desktop.app

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Tauri CLI and build Windows bundles
        shell: pwsh
        run: |
          cd dsh-desktop
          npm install
          npx tauri build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Desktop-Windows
          path: dsh-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install WebKitGTK and Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build
        working-directory: dsh-desktop/src-tauri
        run: cargo build --release

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Desktop-Linux
          path: dsh-desktop/src-tauri/target/release/dsh-desktop
          if-no-files-found: error