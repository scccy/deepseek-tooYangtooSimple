[package]
name = "dsh-desktop"
version = "0.6.8"
description = "DeepSeek Harness desktop shell (Tauri) — Rust shell + WKWebView, DSH (Node) runs as a sidecar"
authors = ["DSH Desktop"]
edition = "2021"
rust-version = "1.77.2"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "6"
mime_guess = "2"
percent-encoding = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
